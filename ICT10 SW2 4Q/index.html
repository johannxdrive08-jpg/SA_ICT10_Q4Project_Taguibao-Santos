<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
	<title>Find your Classmate's Favorite Subjects</title>
	<!-- CSS -->
     <style>
        body {
            background-image: url('55rfven3ftd71.jpg');
            background-size: cover; 
            background-repeat: no-repeat; 
        }
        .header {
            background-color: red;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 5px;
        }
        .content {
           padding: 20px;
           background-color: lightblue; 
           border-radius: 5px;
           box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
           opacity: 0.9; 
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: red;
        }

        h2 {
            text-align: center;
        }
        </style>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
     <!-- header -->
	<div class="container mt-5">	
		 <div class="header">
            <h1>Find your Classmate's Favorite Subjects</h1>
            <p>Fill in these blanks to create an introduction to your chosen classmate.</p>
        </div>
        <div class="content">
	<form>
    <!-- form -->
		<div class="name mb-3">
			<input type="name" class="form-control" id="classmate" placeholder="Classmate's Name">
		</div>

	    <div class="email mb-3">
	        <input type="name" class="form-control" id="section" placeholder="Section">
	    </div>

	    <div class="password mb-3">
	        <input type="name" class="form-control" id="favsubject" placeholder="Favorite Subject">
	    </div>
	        <div class="card shadow mt-4 p-3">
        <h5 class="fw-bold">📋 Classmate List</h5>
        <div id="output" class="mt-2"></div>
         <div class="d-flex gap-2">
            <input type="button" py-click="add_classmate" class="btn btn-primary w-50" value="Add Classmate">
            <input type="button" py-click="show_classmates" class="btn btn-success w-50" value="Show List">
        </div>
    </div>

</div>
<py-script src="main.py"></py-script>

</body>
</html>
